name: TAGAD Frontend CI Pipeline

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, master, develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-verification:
    name: Frontend CI (Typecheck, Tests, Production Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --include=dev

      - name: Typecheck Frontend Codebase
        working-directory: ./frontend
        run: npm run typecheck

      - name: Test Frontend Behavior
        working-directory: ./frontend
        run: npm test

      - name: Compile Frontend Production Build
        working-directory: ./frontend
        run: npm run build

      - name: Verify Build Output Integrity
        working-directory: ./frontend
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html was not generated by Vite build"
            exit 1
          fi
          echo "Frontend build successfully generated dist/index.html and client assets."
