name: TAGAD Security & CodeQL Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday scan at 04:00 UTC
  workflow_dispatch:

jobs:
  codeql-analysis:
    name: CodeQL Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    continue-on-error: true # Prevents pipeline failures if GitHub Advanced Security is disabled on private repos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit Backend Dependencies
        working-directory: ./backend
        run: |
          echo "Scanning backend dependencies for critical vulnerabilities..."
          npm audit --audit-level=critical || echo "Review flagged backend vulnerabilities"

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: |
          echo "Scanning frontend dependencies for critical vulnerabilities..."
          npm audit --audit-level=critical || echo "Review flagged frontend vulnerabilities"

  secret-hygiene:
    name: Secret & Credential Hygiene Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify No Committed Production Secrets
        run: |
          echo "Verifying that no active private keys, service role credentials, or production .env files are tracked in git..."
          if git ls-files | grep -E '(^|/)\.env$' | grep -v '\.example$'; then
            echo "Error: Committed .env file detected in repository git index!"
            exit 1
          fi
          echo "Secret hygiene scan clean."
