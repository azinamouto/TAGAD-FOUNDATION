name: TAGAD Backend Qualification & E2E Pipeline

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-qualification-ci.yml'
      - '.github/workflows/release-readiness.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, master, develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification-suite:
    name: Full Database Qualification (CBMS, GAD, Statistical, Snapshot DR)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      JWT_SECRET: "tagad_qualification_test_jwt_secret_signing_key_2026_super_secure"
      JWT_REFRESH_SECRET: "tagad_qualification_test_jwt_refresh_secret_signing_key_2026_super_secure"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install and Configure PostgreSQL Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-contrib postgresql-client
          # Ensure socket directory exists with runner permissions
          sudo mkdir -p /var/run/postgresql
          sudo chown -R $USER:$USER /var/run/postgresql
          # Discover the PostgreSQL bin directory containing initdb, pg_ctl, createdb
          PG_DIR=$(dirname "$(find /usr/lib/postgresql -name initdb | sort -V | tail -n 1)")
          echo "Detected PG_BIN at $PG_DIR"
          echo "PG_BIN=$PG_DIR" >> "$GITHUB_ENV"
          echo "$PG_DIR" >> "$GITHUB_PATH"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client Engine
        working-directory: ./backend
        run: npx prisma generate

      - name: Execute End-to-End Qualification Suite
        working-directory: ./backend
        shell: bash
        run: |
          set -o pipefail
          npm run test:qualification 2>&1 | tee qualification.log

      - name: Retain Qualification Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/qualification.log
          if-no-files-found: warn
          retention-days: 14
