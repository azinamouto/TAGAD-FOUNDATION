name: TAGAD Release & Production Readiness Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional manual release tag (e.g., v2.0.1)'
        required: false
        type: string

jobs:
  backend-verification:
    name: Backend Tests & Build
    uses: ./.github/workflows/backend-ci.yml

  backend-qualification:
    name: Backend PostgreSQL Qualification
    uses: ./.github/workflows/backend-qualification-ci.yml

  frontend-verification:
    name: Frontend Qualification
    uses: ./.github/workflows/frontend-ci.yml

  production-readiness:
    name: Production Build & Monorepo Verification
    needs: [backend-verification, backend-qualification, frontend-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tagad?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/tagad?schema=public"
      JWT_SECRET: "tagad_release_check_jwt_secret_signing_key_2026_super_secure"
      JWT_REFRESH_SECRET: "tagad_release_check_jwt_refresh_secret_signing_key_2026_super_secure"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --include=dev

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci --include=dev

      - name: Generate Prisma Engine
        working-directory: ./backend
        run: npx prisma generate

      - name: Execute Monorepo Build (Frontend Vite & Backend Typecheck)
        run: |
          npm --prefix frontend run build
          npm --prefix backend run typecheck

      - name: Verify Frontend Production Output
        run: |
          test -f frontend/dist/index.html
          echo "Frontend distribution bundle ready."

      - name: Archive Production Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-release
          path: frontend/dist/
          retention-days: 14

  publish-github-release:
    name: Create GitHub Release
    needs: production-readiness
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-release
          path: dist-release

      - name: Create Zip Archive of Frontend Assets
        run: |
          cd dist-release
          zip -r ../tagad-frontend-assets-${{ github.ref_name }}.zip .
          cd ..

      - name: Draft Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: tagad-frontend-assets-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
