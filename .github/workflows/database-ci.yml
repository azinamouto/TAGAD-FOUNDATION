name: TAGAD Database & Migrations Integrity Pipeline
on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/prisma/**'
      - 'backend/supabase/migrations/**'
      - 'backend/scripts/**'
      - 'docs/realignment/wp03/evidence/**'
      - '.github/workflows/database-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/prisma/**'
      - 'backend/supabase/migrations/**'
      - 'backend/scripts/**'
      - 'docs/realignment/wp03/evidence/**'
      - '.github/workflows/database-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-integrity:
    uses: ./.github/workflows/backend-qualification-ci.yml
